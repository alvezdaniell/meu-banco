<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Banco</title>
<meta name="theme-color" content="#0A1630">
<meta name="description" content="Gestão financeira pessoal: receitas, despesas, investimentos, dívidas e Imposto de Renda.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Meu Banco">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1630;--s1:#0F2046;--s2:#142B5C;--s3:#1D3770;--line:#1F3A70;--tx:#EAF1FF;--mut:#8EA3C7;--pri:#3B82F6;--pri2:#7CB1FF;--gold:#F5B942;--pos:#34D399;--neg:#FF6B6B;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--r:22px;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme=light]{--bg:#EEF3FB;--s1:#FFFFFF;--s2:#F4F7FD;--s3:#E3EBF8;--line:#D3DFF2;--tx:#0B1B3A;--mut:#5A6E94;--pri:#2563EB;--pri2:#3B82F6;--gold:#B7791F;--pos:#0E9F6E;--neg:#D93B3B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}[data-theme=light]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.4 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.disp{font-weight:800;letter-spacing:-.025em}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.pos{color:var(--pos)}.neg{color:var(--neg)}.or{color:var(--pri)}
small,.sm{font-size:12px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.col{display:flex;flex-direction:column}
.hidden{display:none!important}
/* shell */
#app{min-height:100dvh}
main#screen{padding:calc(var(--sat) + 14px) 16px calc(104px + var(--sab));max-width:560px;margin:0 auto}
.page{animation:up .45s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stg>*{animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:8px 10px calc(8px + var(--sab));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:30}
.tab{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:10.5px;font-weight:600;border-radius:14px;transition:.25s}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.3s var(--ease)}
.tab.on{color:var(--pri)}.tab.on svg{transform:translateY(-2px) scale(1.08)}
.fab{position:fixed;right:18px;bottom:calc(86px + var(--sab));width:58px;height:58px;border-radius:20px;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(59,130,246,.45);z-index:31;transition:transform .25s var(--ease)}
.fab:active{transform:scale(.92)}.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.side{display:none}
@media(min-width:900px){
 #app{display:grid;grid-template-columns:250px 1fr}
 .tabbar{display:none}
 .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:26px 16px;border-right:1px solid var(--line)}
 .side .logo{margin:0 8px 22px}
 .side .tab{flex-direction:row;max-width:none;justify-content:flex-start;gap:12px;font-size:14px;padding:12px 14px}
 .side .tab.on{background:var(--s2)}
 main#screen{max-width:1040px;width:100%;padding:28px 36px 60px}
 .fab{right:36px;bottom:34px}
 .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g2>.card{margin-bottom:0}
}
.logo{font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;flex:none}
/* topo */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.hello{font-size:22px;font-weight:800;letter-spacing:-.02em}
.ic{width:42px;height:42px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.ic:active{transform:scale(.92)}.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sub-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.sub-head h1{font-size:20px;font-weight:800}
/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h3{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.card .hd h3{margin:0}
.hero{position:relative;overflow:hidden;border:0;color:#fff;padding:22px;background:linear-gradient(135deg,#1D4ED8 0%,#3B82F6 62%,#7CB1FF 125%)}
.hero:before{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero:after{content:"";position:absolute;inset:-70px auto auto -50px;width:180px;height:180px;border-radius:50%;background:rgba(0,0,0,.14)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:12px;font-weight:600;opacity:.85;letter-spacing:.05em;text-transform:uppercase}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px}
.hero .pill2{background:rgba(255,255,255,.16);border-radius:14px;padding:9px 12px;flex:1;backdrop-filter:blur(6px)}
.hero .pill2 b{display:block;font-size:15px}.hero .pill2 span{font-size:11px;opacity:.85}
.hero.inv{background:linear-gradient(135deg,#3b2a06,#8a5f0f 62%,#D79A22 125%)}
.hero.deb{background:linear-gradient(135deg,#3a1018,#8f2a37 66%,#E4505B 125%)}
.hero.ir{background:linear-gradient(135deg,#0B1B3A,#1D3770 60%,#3B82F6 150%)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mut);transition:.25s var(--ease);scroll-snap-align:center;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.or.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-weight:600;font-size:13px;color:var(--mut);transition:.25s var(--ease)}
.seg button.on{background:var(--tx);color:var(--bg)}
.ypick{display:flex;gap:6px;margin-bottom:10px}
.ypick .chip{padding:7px 14px}
/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%;transition:.2s}
.li:first-child{border-top:0}.li:active{opacity:.6}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--s3)}
.li .t{font-weight:600}.li .s{font-size:12px;color:var(--mut)}
.li .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10.5px;font-weight:700;background:var(--s3);color:var(--mut)}
.tag.rec{background:rgba(59,130,246,.2);color:#7CB1FF}
.tag.spc{background:rgba(255,107,107,.18);color:var(--neg)}.tag.ser{background:rgba(245,185,66,.18);color:var(--gold)}.tag.ok{background:rgba(52,211,153,.16);color:var(--pos)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.empty b{display:block;font-size:30px;margin-bottom:6px}
/* kpis */
.kpis{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}.kpis::-webkit-scrollbar{display:none}
.kpi{flex:none;min-width:150px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi small{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.kpi b{display:block;font-size:18px;margin-top:6px;font-variant-numeric:tabular-nums}
/* progress */
.bar{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--pri);transform-origin:left;animation:grow .9s var(--ease) both}
.bar.warn i{background:var(--gold)}.bar.bad i{background:var(--neg)}.bar.vi i{background:var(--pri2)}
@keyframes grow{from{transform:scaleX(0)}}
.cbar{margin:12px 0}.cbar .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px}
/* alertas */
.al{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--s2);margin-bottom:8px;font-size:13.5px;align-items:flex-start;border:1px solid var(--line)}
.al.warn{background:rgba(245,185,66,.12);border-color:rgba(245,185,66,.4)}.al.ok{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.3)}
.al .e{font-size:16px;line-height:1.2}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;background:var(--pri);color:#fff;transition:.2s var(--ease);width:100%}
.btn:active{transform:scale(.97)}.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line)}.btn.dark{background:var(--tx);color:var(--bg)}.btn.red{background:rgba(255,107,107,.14);color:var(--neg)}.btn.sm{padding:9px 14px;width:auto;font-size:13px;border-radius:12px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mut)}
.qa .ico{width:54px;height:54px;border-radius:19px;background:var(--s1);border:1px solid var(--line);font-size:22px;transition:.25s var(--ease)}
.qa button:active .ico{transform:scale(.9)}
/* menu */
.menu .li{padding:14px 0}.menu .ico{background:var(--s3)}.chev{color:var(--mut);width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
/* formularios */
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.in{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:0;transition:.2s}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:14px 0 18px}.amount span{font-size:22px;font-weight:700;color:var(--mut)}
.amount input{background:none;border:0;outline:0;font-size:46px;font-weight:800;width:62%;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 14px}.chk input{width:20px;height:20px;accent-color:var(--pri)}
.grid-cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-bottom:14px}
.gc{padding:10px 6px;border-radius:14px;background:var(--s2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;text-align:center;transition:.2s var(--ease)}
.gc b{font-size:20px;font-weight:400}.gc.on{background:var(--tx);color:var(--bg);border-color:var(--tx);transform:scale(1.03)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:.3s;backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--s1);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + var(--sab));transform:translateY(100%);transition:transform .4s var(--ease);border:1px solid var(--line);border-bottom:0}
.sheet-wrap.in .scrim{opacity:1}.sheet-wrap.in .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 14px;touch-action:none;cursor:grab}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sh-head h2{font-size:19px;font-weight:800}
.sh-act{display:flex;gap:10px;margin-top:8px}
@media(min-width:900px){.sheet-wrap{align-items:center}.sheet{border-radius:28px;border-bottom:1px solid var(--line);transform:translateY(30px) scale(.96);opacity:0;transition:.35s var(--ease)}.sheet-wrap.in .sheet{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:600;font-size:14px;z-index:90;display:flex;gap:14px;align-items:center;opacity:0;transition:.35s var(--ease);box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:92vw}
.toast.in{opacity:1;transform:translate(-50%,0)}.toast button{font-weight:800;color:var(--pri)}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mut);font-size:9.5px;font-family:inherit}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.bar-r{transform-box:fill-box;transform-origin:50% 100%;animation:vgrow .8s var(--ease) both}
@keyframes vgrow{from{transform:scaleY(0)}}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.area{animation:fade .9s .3s both}@keyframes fade{from{opacity:0}}
.sl{animation:pop .7s var(--ease) both;transform-origin:50% 50%}@keyframes pop{from{opacity:0;transform:scale(.85)}}
.cw{position:relative}.tip{position:absolute;top:0;pointer-events:none;background:var(--tx);color:var(--bg);padding:5px 9px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.donut{display:flex;gap:16px;align-items:center}.donut svg{width:150px;flex:none}.donut .c{flex:1;min-width:0}
.dl{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}.dl i{width:9px;height:9px;border-radius:3px;flex:none}.dl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tabela ir */
.t2{width:100%;border-collapse:collapse;font-size:13px}.t2 td,.t2 th{padding:9px 4px;border-top:1px solid var(--line);text-align:right}.t2 td:first-child,.t2 th:first-child{text-align:left}.t2 th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.t2 tr.tot td{font-weight:800}
/* lock / welcome */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;animation:fade .3s both}
.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut);transition:.2s}.dots i.on{background:var(--pri);border-color:var(--pri);transform:scale(1.15)}
.dots.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:10px}.pad button{height:76px;border-radius:50%;background:var(--s1);border:1px solid var(--line);font-size:26px;font-weight:600;transition:.15s}.pad button:active{background:var(--pri);color:#fff;transform:scale(.92)}
.wel{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;max-width:480px;margin:auto}
.wel h1{font-size:46px;line-height:1.04}.wel h1 em{font-style:normal;color:var(--pri)}
/* papel (relatórios) */
.paper{background:#fff;color:#0B1B3A;border-radius:12px;padding:22px;font-size:12px;--tx:#0B1B3A;--mut:#5A6E94;--line:#D3DFF2;--s3:#EEF2FA;--bg:#fff;--pos:#0E9F6E;--neg:#D93B3B;--pri:#2563EB}
.paper h1{font-size:22px}.paper h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;color:#2563EB}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0B0B0B;padding-bottom:10px;margin-bottom:12px}
.p-brand{font-weight:800;letter-spacing:.02em;color:#2563EB}
.p-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.p-kpis div{border:1px solid #ddd;border-radius:8px;padding:8px}.p-kpis small{color:#666;font-size:10px;text-transform:uppercase}.p-kpis b{display:block;font-size:14px}
.paper .t2 th,.paper .t2 td{padding:5px 3px;border-color:#e5e5e5}
#print-root{display:none}
@media print{
 @page{size:A4;margin:12mm}
 body.printing #app,body.printing .toast,body.printing .sheet-wrap,body.printing .fab{display:none!important}
 body.printing #print-root{display:block}body.printing{background:#fff}
 #print-root .paper{border-radius:0;padding:0}.bar-r,.ln,.area,.sl,.bar i{animation:none!important;stroke-dashoffset:0}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.chips{position:relative}
.is-welcome #app{display:block}.is-welcome .tabbar,.is-welcome .side,.is-welcome .fab{display:none!important}
.is-welcome main#screen{padding:0;max-width:none}
#mchips{margin-bottom:12px}
.side .tab{flex:none!important}
.sh-act{position:sticky;bottom:-22px;background:linear-gradient(to top,var(--s1) 70%,transparent);padding:14px 0 4px;margin-top:6px}
@media print{html{background:#fff!important}body.printing .tabbar,body.printing .side{display:none!important}body.printing #print-root .t2 td,body.printing #print-root .t2 th{color:#0B0B0B}}

</style>
</head>
<body>
<div id="app"><aside class="side"></aside><main id="screen"></main></div>
<nav class="tabbar" aria-label="Navegação"></nav>
<button class="fab hidden" id="fab" data-act="add" aria-label="Novo lançamento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="print-root"></div>
<script src="config.js"></script>
<script>
'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const MESES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MC=MESES.map(m=>m.slice(0,3));
const TIPOS=['Salário','Autônomo (CPF)','Isento','Lucros PJ (CNPJ)'];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{v=+v;return isFinite(v)?v:0};
const clone=o=>JSON.parse(JSON.stringify(o));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
let S=null;
const money=v=>(S&&S.cfg.hide)?'R$ ••••':BRL.format(num(v));
const moneyR=v=>BRL.format(num(v));
const pct=v=>(num(v)*100).toFixed(1).replace('.',',')+'%';
const short=v=>{v=num(v);const a=Math.abs(v);return a>=1000?(v/1000).toFixed(a>=10000?0:1).replace('.',',')+' mil':String(Math.round(v))};
function parseMoney(s){s=String(s??'').trim().replace(/[R$\s]/g,'');if(!s)return 0;

const tabF=(base,rows)=>{if(base<=0)return 0;let r=rows[0];for(const x of rows)if(base>=x[0])r=x;return Math.max(0,base*r[1]-r[2])};

 const trib=sal+aut+nc,saude=A.cats['Saúde']||0,edu=A.cats['Educação']||0,eduDed=Math.min(edu,P.eduMax*(1+dep));
 const dedC=inss+dep*P.depAno+saude+eduDed+outras,simp=Math.min(trib*P.descSimplPct,P.descSimplMax);
 const mod=ded=>{const base=Math.max(0,trib-ded),imposto=tabF(base,P.anual),red=redF(trib,imposto,P.redA),dev=Math.max(0,imposto-red);return{ded,base,imposto,red,dev,saldo:dev-irrf-carne}};
 const comp=mod(dedC),simpl=mod(simp),melhor=comp.saldo<=simpl.saldo?'Completo':'Simplificado',res=Math.min(comp.saldo,simpl.saldo);
 const carneM=A.rows.map(t=>{const s=t.tipos['Salário'],a=t.tipos['Autônomo (CPF)'],xt=s+a;
  const f=x=>{const b=Math.max(0,x-P.descSimplMensal),tb=tabF(b,P.mensal);return Math.max(0,tb-redF(x,tb,P.redM))};
  return{i:t.i,sal:s,aut:a,car:a===0?0:Math.max(0,f(xt)-f(s))}});
 const inv=invTL().filter(x=>x.y===y);
 return{A,d,sal,aut,iso,luc,nc,trib,saude,edu,eduDed,inss,irrf,carne,dep,outras,dedC,simp,comp,simpl,melhor,res,carneM,
  contasDez:A.rows.length?A.rows[A.rows.length-1].contas:0,invDez:inv.length?inv[inv.length-1].fin:0}}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mb::'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=5381;for(const c of 'mb::'+s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'f'+h}}

 el.innerHTML=`${LOGO}<h2 style="font-size:20px">${esc(title)}</h2><p class="mut sm">${esc(sub)}</p><div class="dots">${'<i></i>'.repeat(4)}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="c" class="sm">${cancel?'Cancelar':''}</button><button data-n="0">0</button><button data-n="d">⌫</button></div>`;
 document.body.appendChild(el);const dots=$$('.dots i',el);
 el.addEventListener('click',async e=>{const b=e.target.closest('[data-n]');if(!b)return;const n=b.dataset.n;navigator.vibrate&&navigator.vibrate(8);
  if(n==='c'){if(cancel)el.remove();return}if(n==='d')v=v.slice(0,-1);else if(v.length<4)v+=n;dots.forEach((d,i)=>d.classList.toggle('on',i<v.length));
  if(v.length===4){const r=await onDone(v);if(r===false){v='';const dd=$('.dots',el);dd.classList.add('shake');navigator.vibrate&&navigator.vibrate([30,40,30]);setTimeout(()=>{dd.classList.remove('shake');dots.forEach(d=>d.classList.remove('on'))},420)}else el.remove()}})}

  <label class="fld"><span>Já investido antes de ${S.anos[0]} (R$)</span><input class="in" inputmode="decimal" data-bind="cfg.investidoInicial" data-kind="money" value="${inputVal(S.cfg.investidoInicial)}"></label>

   <h2>Despesas por categoria</h2>${donutBlock(A.cats,8)}
   <h2>Investimentos e dívidas</h2><table class="t2"><tr><td>Aportado no ano</td><td>${moneyR(iv.ap)}</td></tr><tr><td>Rendimento no ano</td><td>${moneyR(iv.rend)}</td></tr><tr><td>Patrimônio investido em dezembro</td><td>${moneyR(iv.fim)}</td></tr><tr><td>Dívidas em aberto (posição atual)</td><td>${moneyR(d.saldo)}</td></tr></table></div>`}
  else{const t=T(mk(y,mi)),ant=mi>0?T(mk(y,mi-1)):(S.anos.includes(y-1)?T(mk(y-1,11)):null),g=(a,b)=>b?((b>0?(a/b-1):0)):null;
   const rows=[['Receitas','rec'],['Despesas fixas','fix'],['Despesas extras','ext'],['Gastos do dia a dia','gas'],['Total de despesas','tot'],['Investimento (aplicação fixa)','inv'],['Guardado na poupança','poup'],['Saldo livre do mês','saldo']];
   h=`<div class="paper"><div class="p-head"><div><div class="p-brand">Meu Banco</div><h1>Relatório de ${MESES[mi]} ${y}</h1><small>${esc(S.name)}</small></div><small>Gerado em ${now}</small></div>
   <div class="p-kpis"><div><small>Receitas</small><b>${moneyR(t.rec)}</b></div><div><small>Despesas</small><b>${moneyR(t.tot)}</b></div><div><small>Saldo livre</small><b>${moneyR(t.saldo)}</b></div><div><small>Saldo acumulado</small><b>${moneyR(t.acum)}</b></div></div>

 }finally{S.cfg.hide=rv}

 el.addEventListener('click',e=>{
  const o=e.target.closest('[data-sel] [data-v]');if(o){const c=o.closest('[data-sel]'),was=o.classList.contains('on');$$('[data-v]',c).forEach(x=>x.classList.remove('on'));if(!was||c.dataset.sel==='req')o.classList.add('on');return}
  if(e.target.closest('[data-save]'))onSave(el);else if(e.target.closest('[data-del]'))onDelete(el)});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox')onSave(el)});
 return el}

const ensureYear=y=>{if(!S.anos.includes(y)){S.anos.push(y);S.anos.sort()}};
const lastDay=k=>new Date(+k.slice(0,4),+k.slice(5),0).getDate();

 <div data-for="receitas"><div class="fld"><span>Tipo para o Imposto de Renda</span></div><div class="chips" style="margin-bottom:12px" id="f-tipo" data-sel>${TIPOS.map(x=>`<button type="button" class="chip ${edit&&it.tipo===x?'on':''}" data-v="${x}">${x}</button>`).join('')}</div></div>
 <div data-for="invest"><div class="seg" id="f-sub" data-sel="req" style="margin-bottom:12px"><button type="button" class="on" data-v="invest">Aplicação fixa</button><button type="button" data-v="poup">Poupança</button></div></div>
 <label class="fld" data-for="gastos extras fixas receitas"><span>Data${edit&&!dv0?' (sem data — escolha uma)':''}</span><input class="in" type="date" id="f-data" value="${dv0}" ${dr}></label>
 ${edit?'':`<label class="chk" data-for="extras fixas receitas"><input type="checkbox" id="f-rec"> Repetir todo mês (recorrente)</label>`}`,
 onSave:async el=>{
  const val=parseMoney($('#f-val',el).value);if(!(val>0)){toast('Informe o valor');$('#f-val',el).focus();return}
  const cat=$('#f-cat .on',el)?.dataset.v||'',tipo=$('#f-tipo .on',el)?.dataset.v||'',data=$('#f-data',el).value||(edit?'':today()),k2=edit?key:(data||today()).slice(0,7);
  let nome=($('#f-nome',el)?.value||'').trim();if(!nome&&t!=='invest')nome=cat||(t==='receitas'?'Receita':'Sem descrição');
  if(['gastos','extras','fixas'].includes(t)&&cat){const c=catInfo(cat);if(c.limite>0){const novo=catTotal(k2,cat)-(edit?num(it.valor):0)+val;
   if(novo>c.limite){const blk=S.cfg.limitMode==='bloquear';if(!await confirmBox({title:blk?'🚫 Limite atingido':'⚠️ Acima do limite',text:`Com este lançamento, ${cat} chega a ${moneyR(novo)} em ${MESES[+k2.slice(5)-1]}, acima do limite de ${moneyR(c.limite)}.`,ok:'Lançar mesmo assim',cancel:'Cancelar',danger:blk,swap:blk}))return}}}
  ensureYear(+k2.slice(0,4));snapshot();const m=editM(k2);
  if(t==='invest'){const sub=$('#f-sub .on',el)?.dataset.v||'invest';m[sub]=num(m[sub])+val}
  else if(edit){Object.assign(m[t].find(x=>x.id===id),{nome,valor:val,data},t==='receitas'?{tipo}:{cat})}

  save();closeSheet();const prevY=ui.y;ui.y=+k2.slice(0,4);ui.m=+k2.slice(5)-1;render();toast(edit?'Lançamento atualizado ✓':'Lançado ✓')},
 onMount:el=>{const sync=tt=>{t=tt;$$('[data-for]',el).forEach(n=>n.classList.toggle('hidden',!n.dataset.for.split(' ').includes(t)));$$('#f-tipos .chip',el).forEach(c=>c.classList.toggle('on',c.dataset.tp===t))};

 foot(){const n=this.pages.length;this.pages.forEach((c,i)=>{this.c=c;this.text(`Meu Banco · gerado em ${new Date().toLocaleDateString('pt-BR')} · página ${i+1} de ${n}`,this.W/2,this.H-16,{size:7,color:'#8A96AD',align:'c'})})}

  // objetos: 1 catalogo, 2 pages, 3 F1, 4 F2, depois (pagina, conteudo)*
  const kids=[];for(let i=0;i<np;i++)kids.push(`${5+i*2} 0 R`);
  const objs=[`<< /Type /Catalog /Pages 2 0 R >>`,`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${np} >>`,`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`,`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`];
  this.pages.forEach((c,i)=>{const st=c.join('\n');objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+i*2} 0 R >>`);objs.push(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`)});
  let out='%PDF-1.4\n',offs=[];objs.forEach((b,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${b}\nendobj\n`});
  const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(x=>String(x).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return new Blob([u],{type:'application/pdf'})}
}

 rows.push(['Total',moneyR(A.rec),moneyR(A.fix),moneyR(A.ext),moneyR(A.gas),moneyR(A.tot),moneyR(A.investido),moneyR(A.saldo),moneyR(A.acumDez)]);
 p.table(m,yy,cols,rows,{rh:15,total:true,size:7.5});

 yy=p.hbars(m,yy+4,w/2-10,cats.slice(0,14),cats[0]?cats[0][1]:1)+10;
 const y2=p.h2('Investimentos e dívidas',m+w/2+10,82+4,w/2-10);

 const name=pdfFileName(),file=new File([blob],name,{type:'application/pdf'});
 if(!open&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;if(open)a.target='_blank';else a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast(open?'Abrindo PDF…':'PDF salvo ✓')}

/* ============ conta (login) e sincronização na nuvem ============ */
const CFG=window.MB_CONFIG||{};const CLOUD=!!(CFG.url&&CFG.key);
const AUTHK='meubanco.auth',DIRTY='meubanco.dirty',BAKK='meubanco.bak';
let AUTH=null,_syncT=null,_syncBusy=false,syncSt=CLOUD?'ok':'off';
function authLoad(){try{AUTH=JSON.parse(localStorage.getItem(AUTHK)||'null')}catch(e){AUTH=null}}
function setSession(j){AUTH={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,email:(j.user&&j.user.email)||(AUTH&&AUTH.email)||'',uid:(j.user&&j.user.id)||(AUTH&&AUTH.uid)||''};try{localStorage.setItem(AUTHK,JSON.stringify(AUTH))}catch(e){}}
async function sb(path,{method='GET',body,token,headers={}}={}){
 const r=await fetch(CFG.url.replace(/\/+$/,'')+path,{method,headers:{apikey:CFG.key,'Content-Type':'application/json',Authorization:'Bearer '+(token||CFG.key),...headers},body:body?JSON.stringify(body):undefined});
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const e=new Error((j&&(j.msg||j.error_description||j.message||j.error))||('Erro '+r.status));e.status=r.status;e.code=j&&(j.error_code||j.code);throw e}return j}
async function tokenOk(){if(!AUTH)throw Object.assign(new Error('Sem login'),{status:401});if(Date.now()<AUTH.exp)return AUTH.access;
 const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:AUTH.refresh}});setSession(j);return AUTH.access}
const authMsg=e=>{const m=String(e&&e.message||'');if(/failed to fetch|network|load failed/i.test(m))return'Sem conexão com a internet.';
 if(/invalid login/i.test(m))return'E-mail ou senha incorretos.';if(/not confirmed/i.test(m))return'Confirme seu e-mail (veja a caixa de entrada) e tente de novo.';
 if(/already registered|already been registered/i.test(m))return'Este e-mail já tem conta. Toque em Entrar.';if(/signups? not allowed|signup.*disabled/i.test(m))return'Cadastro desativado. Use Entrar com sua conta.';
 if(/password/i.test(m)&&/6|short|weak/i.test(m))return'Senha muito curta. Use pelo menos 8 caracteres.';if(/rate limit|too many/i.test(m))return'Muitas tentativas. Espere um pouco e tente de novo.';return m||'Algo deu errado.'};
const syncLabel=()=>!CLOUD?'':syncSt==='sync'?'☁ Sincronizando…':syncSt==='err'?'⚠ Sem sincronizar':syncSt==='off'?'':'☁ Sincronizado';
function setStatus(st){syncSt=st;$$('.sync-pill').forEach(e=>e.textContent=syncLabel())}
const cloudRow=async()=>{const tk=await tokenOk();const a=await sb('/rest/v1/dados?select=conteudo,atualizado&user_id=eq.'+AUTH.uid,{token:tk});return a&&a[0]||null};
function applyCloud(row){try{localStorage.setItem(BAKK,localStorage.getItem(KEY)||'')}catch(e){}
 const o=migrate(row.conteudo);o.upd=row.atualizado;o.cloudUid=AUTH.uid;S=o;_tl=null;_inv=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}localStorage.removeItem(DIRTY)}
function queuePush(){if(!CLOUD||!AUTH)return;try{localStorage.setItem(DIRTY,'1')}catch(e){}clearTimeout(_syncT);setStatus('sync');_syncT=setTimeout(push,1500)}
async function push(){if(!CLOUD||!AUTH||!S||_syncBusy)return;if(!navigator.onLine){setStatus('err');return}_syncBusy=true;setStatus('sync');
 try{const tk=await tokenOk(),row=await cloudRow();
  if(row&&row.atualizado>(S.upd||0)){const busy=document.querySelector('.sheet-wrap,.lock');applyCloud(row);if(!busy){initUI();render()}toast('Dados mais novos vindos de outro aparelho');setStatus('ok');return}
  const snap=S.upd;S.cloudUid=AUTH.uid;
  await sb('/rest/v1/dados?on_conflict=user_id',{method:'POST',token:tk,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{user_id:AUTH.uid,conteudo:S,atualizado:S.upd}});
  if(S.upd===snap){localStorage.removeItem(DIRTY);setStatus('ok')}else queuePush()}
 catch(e){setStatus('err');if(e.status===401||(e.status===400&&/refresh|session|token/i.test(e.message)))sessionExpired()}
 finally{_syncBusy=false}}
async function pull(){if(!CLOUD||!AUTH||!S||_syncBusy||localStorage.getItem(DIRTY)||!navigator.onLine)return;
 try{const row=await cloudRow();if(row&&row.atualizado>(S.upd||0)){if(document.querySelector('.sheet-wrap,.lock')||document.activeElement?.matches('input,select,textarea'))return;applyCloud(row);initUI();render();toast('Dados atualizados de outro aparelho ☁')}setStatus('ok')}
 catch(e){if(e.status===401||(e.status===400&&/refresh|session|token/i.test(e.message)))sessionExpired();else setStatus('err')}}
function sessionExpired(){AUTH=null;localStorage.removeItem(AUTHK);loginScreen('Sua sessão expirou. Entre de novo (seus dados deste aparelho foram mantidos).')}
async function afterLogin(){ // decide quais dados valem depois de entrar
 setStatus('sync');let row=null;try{row=await cloudRow()}catch(e){setStatus('err');toast(authMsg(e))}
 if(!row){if(S){S.upd=Date.now();S.cloudUid=AUTH.uid;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}else setStatus('ok')}
 else if(!S){applyCloud(row);setStatus('ok')}
 else if(S.cloudUid===AUTH.uid){if(row.atualizado>(S.upd||0))applyCloud(row);else if(row.atualizado<(S.upd||0))push();setStatus('ok')}
 else{const useCloud=await confirmBox({title:'Já existem dados na sua conta',text:'Este aparelho também tem dados. Usar os dados da sua conta (nuvem) ou manter os deste aparelho? O que você não escolher será substituído, mas fica guardado como cópia de segurança neste aparelho.',ok:'Usar os da nuvem',cancel:'Manter deste aparelho'});
  if(useCloud)applyCloud(row);else{try{localStorage.setItem(BAKK+'.nuvem',JSON.stringify(row.conteudo))}catch(e){}S.upd=Date.now();S.cloudUid=AUTH.uid;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}setStatus('ok')}
 enter(true)}
function loginScreen(msg=''){document.body.classList.add('is-welcome');document.documentElement.dataset.theme='dark';$('.lock')?.remove();$('.sheet-wrap')?.remove();
 $('#screen').innerHTML=`<div class="wel page stg">${LOGO}<h1 class="disp">Entre na sua<br><em>conta.</em></h1>
 <p class="mut">Com login, seus dados ficam guardados na nuvem e você acessa de qualquer aparelho.</p>
 <label class="fld"><span>E-mail</span><input class="in" id="l-email" type="email" autocomplete="username" inputmode="email" value="${esc((AUTH&&AUTH.email)||localStorage.getItem('meubanco.email')||'')}"></label>
 <label class="fld"><span>Senha</span><input class="in" id="l-pass" type="password" autocomplete="current-password"></label>
 <p class="sm" id="l-msg" style="color:var(--neg);min-height:20px">${esc(msg)}</p>
 <button class="btn" data-act="login">Entrar</button><button class="btn ghost" data-act="signup">Criar conta</button>
 <p class="xs mut" style="text-align:center;margin-top:6px">Criar conta é só na primeira vez. Depois, entre com o mesmo e-mail e senha em qualquer aparelho.</p></div>`;
 $$('.stg>*').forEach((e,i)=>e.style.setProperty('--i',i));
 $('#l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')A.login()})}
async function doAuth(kind){const em=($('#l-email').value||'').trim().toLowerCase(),pw=$('#l-pass').value,msg=$('#l-msg');
 if(!/^\S+@\S+\.\S+$/.test(em)){msg.textContent='Digite um e-mail válido.';return}if(pw.length<8){msg.textContent='A senha precisa ter pelo menos 8 caracteres.';return}
 msg.style.color='var(--mut)';msg.textContent=kind==='signup'?'Criando conta…':'Entrando…';
 try{const j=await sb(kind==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:{email:em,password:pw}});
  if(!j||!j.access_token){msg.style.color='var(--neg)';msg.textContent='Conta criada. Confirme o e-mail que enviamos e depois toque em Entrar.';return}
  try{localStorage.setItem('meubanco.email',em)}catch(e){}setSession(j);AUTH.email=em;localStorage.setItem(AUTHK,JSON.stringify(AUTH));await afterLogin()}
 catch(e){msg.style.color='var(--neg)';msg.textContent=authMsg(e)}}
async function logout(){if(!await confirmBox({title:'Sair da conta?',text:'Este aparelho será limpo (seus dados continuam guardados na nuvem). Antes de sair, tento enviar o que estiver pendente.',ok:'Sair',danger:true}))return;
 if(localStorage.getItem(DIRTY)){await push();if(localStorage.getItem(DIRTY)){if(!await confirmBox({title:'Há dados sem enviar',text:'Não consegui enviar as últimas alterações (sem internet?). Se sair agora, elas serão perdidas.',ok:'Sair mesmo assim',danger:true}))return}}
 [KEY,AUTHK,DIRTY].forEach(k=>localStorage.removeItem(k));S=null;AUTH=null;loginScreen()}
function contaCard(){if(!CLOUD)return`<section class="card menu"><h3>Conta e nuvem</h3><p class="sm mut" style="line-height:1.6">O login ainda não está ligado. Para usar em vários aparelhos, preencha o arquivo <b>config.js</b> (veja o passo a passo no README).</p></section>`;
 return `<section class="card menu"><h3>Conta e nuvem</h3><div class="li" style="cursor:default"><div class="ico">☁️</div><div class="sp"><div class="t">${esc((AUTH&&AUTH.email)||'')}</div><div class="s sync-pill">${syncLabel()}</div></div></div>
 <div class="row" style="gap:10px;margin-top:8px"><button class="btn ghost sm" data-act="syncNow">Sincronizar agora</button><button class="btn ghost sm" data-act="logout">Sair</button></div></section>`}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
window.addEventListener('online',()=>{if(localStorage.getItem(DIRTY))push();else pull()});

function enter(skipLock){document.body.classList.remove('is-welcome');if(S){initUI();if(!skipLock)lockApp()}let h=[];try{h=(location.hash||'').replace(/^#\/?/,'').split('/')}catch(e){}applyRoute(h[0]||'home',h[1])}
function boot(){load();authLoad();
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
 if(CLOUD&&!AUTH){loginScreen();return}
 enter();if(CLOUD&&AUTH){setStatus(localStorage.getItem(DIRTY)?'sync':'ok');setTimeout(()=>{if(localStorage.getItem(DIRTY))push();else pull()},800)}}

boot();
</script>
